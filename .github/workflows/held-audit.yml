name: Held Audit

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out Held
        uses: actions/checkout@v4

      - name: Syntax and asset audit
        run: |
          set -euo pipefail
          for file in *.js; do
            node --check "$file"
          done
          python3 .github/tests/static_audit.py

      - name: Install browser audit dependency
        run: |
          python3 -m pip install --disable-pip-version-check -q selenium

      - name: Browser interaction smoke test
        run: |
          set -euo pipefail
          python3 -m http.server 8765 >/tmp/held-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          python3 .github/tests/run_browser_audit.py
