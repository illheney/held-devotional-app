<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#f4efe7" />
  <title>Repair Held</title>
  <style>
    :root{color-scheme:light;background:#f4efe7;color:#334037;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box}
    main{width:min(520px,100%);background:#fffaf3;border:1px solid #ddd4c8;border-radius:24px;padding:28px;box-sizing:border-box;box-shadow:0 18px 60px rgba(40,52,43,.09)}
    h1{font-family:Georgia,serif;font-weight:500;margin:0 0 12px;font-size:34px}p{line-height:1.55;color:#657066}.status{margin:22px 0;padding:14px 16px;border-radius:14px;background:#edf0e9;color:#435346}.btn{display:block;width:100%;border:0;border-radius:14px;padding:14px 18px;background:#6f826d;color:white;font-weight:700;font-size:16px}.small{font-size:13px}
  </style>
</head>
<body>
<main>
  <h1>Repair Held</h1>
  <p>This refreshes Held's app files without deleting your journal, prayers, progress, saved devotionals, or personalization.</p>
  <div class="status" id="status">Preparing a clean restart…</div>
  <button class="btn" id="repair" type="button">Repair and reopen Held</button>
  <p class="small">Only Held's cached app files and service worker are reset. Your local Held data is preserved.</p>
</main>
<script>
(async()=>{
  const status=document.getElementById('status');
  const button=document.getElementById('repair');
  const repair=async()=>{
    button.disabled=true;
    status.textContent='Refreshing Held…';
    try{
      if('serviceWorker' in navigator){
        const registrations=await navigator.serviceWorker.getRegistrations();
        await Promise.all(registrations.filter(r=>r.scope.includes('/held-devotional-app/')).map(r=>r.unregister()));
      }
      if('caches' in window){
        const keys=await caches.keys();
        await Promise.all(keys.filter(k=>k.startsWith('held-')).map(k=>caches.delete(k)));
      }
      status.textContent='Held is refreshed. Reopening now…';
      setTimeout(()=>location.replace('./?v=1.7.2&recovered='+Date.now()),350);
    }catch(error){
      status.textContent='The automatic repair could not finish. Close Held completely, reopen this page in Safari, and tap Repair again.';
      button.disabled=false;
    }
  };
  button.addEventListener('click',repair);
  await repair();
})();
</script>
</body>
</html>
